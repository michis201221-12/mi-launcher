name: Compilar GameMode SA-MP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar Arquitectura 32-bits y Dependencias
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 lib32z1 wget tar

      - name: Instalar Compilador Pawn
        run: |
          wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          sudo cp pawnc-3.10.10-linux/bin/pawncc /usr/bin/pawncc
          sudo cp pawnc-3.10.10-linux/lib/libpawnc.so /usr/lib/
          sudo cp pawnc-3.10.10-linux/lib/libpawnc.so /usr/lib/i386-linux-gnu/ 2>/dev/null || true
          sudo chmod +x /usr/bin/pawncc
          sudo ldconfig

      - name: Compilar catrp.pwn
        run: |
          pawncc gamemodes/catrp.pwn -iincludes -ipawno/include -ipawnc-3.10.10-linux/include

      - name: Enviar AMX a Telegram
        uses: appleboy/telegram-action@master
        with:
          to: 8702171990
          token: "8956446043:AAFz1Tx5wf9wZGT9-z4CuwqwctmvWaUxW4Y"
          document: gamemodes/catrp.amx
          message: "¡Tu GameMode catrp.amx se ha compilado con éxito!"
