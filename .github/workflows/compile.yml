name: Compilar GameMode SA-MP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Arquitectura i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386

      - name: Descargar Compilador Pawn (Linux)
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xzf pawnc-3.10.10-linux.tar.gz
          cp pawnc-3.10.10-linux/bin/pawncc pawno/pawncc
          chmod +x pawno/pawncc

      - name: Compilar catrp.pwn
        run: |
          ./pawno/pawncc gamemodes/catrp.pwn -iincludes -ipawno/include -o"gamemodes/catrp.amx" -; -(${

      - name: Guardar AMX Compilado
        uses: actions/upload-artifact@v4
        with:
          name: catrp-amx
          path: gamemodes/catrp.amx
